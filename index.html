.market-logo{display:grid;justify-items:center;gap:2px}.market-logo small{font-size:10px;letter-spacing:0;color:#5b6980;white-space:nowrap}.market-tabs button:hover{text-decoration:none}.market-tabs button[aria-selected=false]:hover{border-bottom-color:transparent}
.factory-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr) auto;gap:14px}.factory-row .factory-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.factory-row .factory-stats span{white-space:nowrap}#entry form{justify-content:flex-end;background:none;box-shadow:none;border:0;outline:0}
.card .product-photo{max-width:clamp(142px,16vw,218px)}.rank-item .product-photo img{transition:transform .25s ease;transform-origin:calc((50% - var(--photo-x)) / var(--sheet-cols,3)) calc((50% - var(--photo-y)) / var(--sheet-rows,4))}

.card{cursor:pointer}.card-photo-button{display:block;align-self:center;width:100%;padding:0;border:0;background:none}.card-photo-button .product-photo{margin-inline:auto}.card button[data-remove]{color:#536079;background:#e7ebf2;display:grid;place-items:center}.cart-kept,.cart-delete{grid-area:1/1;transition:opacity .17s,transform .17s}.cart-delete{opacity:0;transform:translateY(4px)}.card button[data-remove]:is(:hover,:focus-visible){background:#f9e6e8;color:#942b3d}.card button[data-remove]:is(:hover,:focus-visible) .cart-kept{opacity:0;transform:translateY(-4px)}.card button[data-remove]:is(:hover,:focus-visible) .cart-delete{opacity:1;transform:none}
@media(hover:none){.card button[data-remove] .cart-kept{display:none}.card button[data-remove] .cart-delete{opacity:1;transform:none}}

.conversation-screen .rec-grid{grid-template-columns:repeat(2,minmax(0,168px))}.rank-card.sales,.rank-card.trend,.rank-card.flash{--rank-bg:#edf3ff;border:1px solid #c8d6ee;box-shadow:0 5px 14px #243e6a17}.image-result #clear-image{margin-left:auto}
@media(max-width:600px){.image-result{flex-wrap:wrap}.image-result #clear-image{margin-left:0}}

@media(max-width:600px){.conversation-screen .chat-log>.message:not(.user){max-width:82%}}

body.ai-start{background:#edf0f7}.ai-start #main{width:100%;max-width:none;padding:0}.ai-start .demo-note{display:none}.ai-welcome{position:relative;isolation:isolate;min-height:calc(100dvh - 75px);display:grid;place-items:center;overflow:hidden;padding:40px 18px;background:#e8edf7}.bag-wall{position:absolute;inset:-18% -4%;z-index:-2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;transform:rotate(-8deg) scale(1.05);filter:blur(1.2px);opacity:.68;pointer-events:none}.ai-welcome::after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,#f9fbfffa 8%,#f7f9fdec 32%,#f2f5fbd0 55%,#e7edf59e 100%)}.wall-column{overflow:hidden}.wall-track,.wall-set{display:grid;gap:14px}.wall-set .art{height:auto;aspect-ratio:1.12;border-radius:16px}.wall-column:nth-child(even) .wall-track{animation-direction:reverse}.wall-track{animation:bag-flow 78s linear infinite;will-change:transform}.ai-welcome[hidden] .wall-track,#ai-view[hidden] .wall-track{animation-play-state:paused}@keyframes bag-flow{to{transform:translateY(calc(-50% - 7px))}}.ai-welcome-inner{width:min(100%,690px);text-align:center;padding:32px 14px;display:grid;justify-items:center;gap:14px}.welcome-logo{width:118px;border-radius:8px;mix-blend-mode:multiply}.ai-welcome h1{font-size:clamp(36px,6vw,74px);font-weight:850;line-height:1.1;letter-spacing:-.055em;color:#1c2c49}.ai-welcome #ai-composer{width:100%;margin-top:12px}.ai-welcome form{width:100%;max-width:none;padding:7px;border-radius:17px;background:#fff;box-shadow:0 10px 40px #233e7020}.ai-welcome form input{min-height:44px}.ai-examples{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.ai-examples .chip{background:#ffffffce}.welcome-status{font-size:12px;color:#536081}.manual-filters label{font-size:14px;color:#495d7d}.manual-filters select{font:inherit;background:white;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}.manual-filters .btn{min-height:35px;padding:4px 9px}
@media(max-width:690px){.market-bar,.conversation-screen .market-bar{grid-template-columns:auto 1fr;gap:5px 10px}.app-tabs{justify-self:end}.market-right,.conversation-screen .market-right{grid-row:2;grid-column:1/-1;justify-items:end;width:100%}.market-search{grid-row:3}.conversation-screen #back-home{grid-column:1;grid-row:2;z-index:1}.conversation-screen .market-actions{width:auto}.bag-wall{grid-template-columns:repeat(3,minmax(0,1fr));inset:-12% -20%}.wall-column:nth-child(4){display:none}.ai-welcome{min-height:calc(100dvh - 115px)}.ai-welcome-inner{padding-inline:0}}
@media(prefers-reduced-motion:reduce){.wall-track{animation:none}}

.ai-welcome::after{pointer-events:none}.bag-wall{pointer-events:auto;filter:none;opacity:.78}.wall-tile{display:block;width:100%;min-width:0;padding:0;border:0;border-radius:16px;background:transparent;transition:transform .24s ease,filter .24s ease;filter:blur(1px);outline-offset:-4px}.wall-tile:is(:hover,:focus-visible){transform:scale(1.045);filter:blur(0);z-index:1}.ai-welcome-inner{pointer-events:none}.ai-welcome-inner :is(input,button,form){pointer-events:auto}.wall-preview .wall-track{animation-play-state:paused}#detail:has(.art){overflow:visible}.wall-preview #detail.detail-closing::backdrop{animation-duration:.28s}.rank-heading h3 span{font-size:.93em;margin-left:3px}
@media(prefers-reduced-motion:reduce){.wall-tile:is(:hover,:focus-visible){transform:none}}
.conversation-screen .chat-log>.message.recommendation-intro{background:transparent;padding:0 1px;color:#455775;max-width:min(100%,660px);font-size:14px;border-radius:0}
.current-need .inferred{background:#f0eafa;color:#614581}

#detail #add.remove-cart-action{display:grid;place-items:center;background:#e7ebf2;color:#536079}#detail #add.remove-cart-action.show-remove{background:#a72d3d;color:#fff}.drawer::backdrop{backdrop-filter:blur(5px)}.drawer-checkout{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.drawer-checkout output{color:var(--green);font-weight:750;white-space:nowrap}
@media(max-width:600px){.drawer{width:calc(100% - 28px)}.drawer-checkout{gap:6px}.drawer-checkout output{font-size:14px}}

<body><a class="skip" href="#main">跳到导购</a>
<header><div class="wrap market-bar"><div class="app-tabs" role="tablist" aria-label="选择选购方式"><button type="button" id="ai-tab" role="tab" aria-selected="true" aria-controls="ai-view">AI 导购</button><button type="button" id="shelf-tab" role="tab" aria-selected="false" aria-controls="shelf-view" tabindex="-1">传统货架</button></div>
<div class="market-logo"><img id="logo" alt="赛夫" hidden><strong id="logo-text">赛夫</strong><small>王浩宇 · AI 背包导购</small></div>
<button id="back-home" hidden class="btn subtle" type="button">返回首页</button><div class="market-search" id="home-search"><div class="market-tabs" role="tablist" aria-label="货源类型">
<button id="goods-tab" role="tab" aria-selected="true" aria-controls="goods-view" type="button">找商品</button>
<button id="factory-tab" role="tab" aria-selected="false" aria-controls="factory-view" type="button" tabindex="-1">找工厂</button>
</div><form id="search"><input id="input" aria-label="背包需求" maxlength="300" autocomplete="off" placeholder="搜索商品名称或包型"><button class="btn" id="send">搜索</button><button class="btn subtle" id="image-search" type="button">以图搜款</button><input hidden id="image-file" type="file" accept="image/*"></form></div>
<div class="market-right"><nav class="market-actions" aria-label="我的入口">
<button type="button" data-panel="收藏">收藏</button>
<button type="button" data-panel="足迹">足迹</button><button type="button" data-panel="购物车">购物车 <span class="cart-count" id="count" aria-live="polite">0</span></button>

</nav></div></div></header>
<main class="wrap" id="main"><div id="ai-view" role="tabpanel" aria-labelledby="ai-tab"><section id="ai-welcome" class="ai-welcome" aria-labelledby="ai-heading"><div class="bag-wall" aria-label="包袋拼贴" id="bag-wall"></div><div class="ai-welcome-inner"><img class="welcome-logo" src="images/logo.png" alt="赛夫"><h1 id="ai-heading">说一句话，帮你挑包</h1><div id="ai-composer"></div><div class="ai-examples" id="ai-examples" aria-label="试试这些需求"></div><p class="welcome-status" id="welcome-status">离线规则</p><button type="button" id="resume-chat" class="btn subtle" hidden>继续上次对话</button></div></section></div><div id="shelf-view" role="tabpanel" aria-labelledby="shelf-tab" hidden><div id="goods-view" role="tabpanel" aria-labelledby="goods-tab"><div class="session-tools"><div class="connection"><span class="status" id="mode" role="status">离线规则（未连接 DeepSeek）</span><small id="mode-help">用 start-deepseek.ps1 启动并输入 Key 可开启</small></div><button class="btn subtle" id="reset" type="button">重新开始</button></div>

<div class="workspace"><div id="image-result" class="image-result" hidden><img id="query-thumb" alt="搜索图片缩略图"><div><strong id="vision-title">正在识图…</strong><p id="vision-note" class="muted" role="status">DeepSeek 将分析包型和风格</p></div><button id="clear-image" class="btn subtle" type="button">返回全部商品</button></div><div id="rankings" class="rankings" aria-label="货源榜单"></div><section aria-labelledby="shelf-title"><div class="shelf-head"><h2 id="shelf-title">精选货源</h2></div><div class="filters manual-filters" id="filters"><label>用途 <select id="manual-scene"><option value="">不限</option><option>通勤</option><option>骑行</option><option>校园</option><option>商务</option><option>户外</option></select></label><label>预算 <select id="manual-budget"><option value="">不限</option><option value="100">¥100 以内</option><option value="300">¥300 以内</option><option value="500">¥500 以内</option></select></label><label>重量 <select id="manual-weight"><option value="">不限</option><option value="500">500 g 以内</option><option value="700">700 g 以内</option></select></label><button id="manual-reset" class="btn subtle" type="button">清除筛选</button></div><p class="muted" id="summary" role="status"></p><div class="cards" id="cards"></div><div id="paging" class="paging"><nav id="pages" class="pages" aria-label="货源分页"></nav><form id="page-jump" aria-label="跳转到货源页"><input id="page-number" type="text" inputmode="numeric" aria-label="输入页码" placeholder="输入页码"><button class="btn subtle">跳转</button></form></div></section>
</div>
</div><section id="factory-view" role="tabpanel" aria-labelledby="factory-tab" hidden><h2>精选工厂</h2><p class="muted">工厂、评分与评价为演示数据。</p><div id="factories"></div></section></div><aside hidden id="conversation-panel" class="chat-panel" aria-labelledby="chat-title"><div class="chat-head"><h2 id="chat-title">导购对话</h2><button id="new-chat" type="button" class="btn subtle">新对话</button></div><section id="current-need" class="current-need" aria-label="当前需求"></section><div class="chat-body"><div class="chat-log" id="chat" role="log" aria-live="polite"></div><div class="chat-controls"><div class="choices" id="choices"></div><form id="follow-up"><input id="follow-input" aria-label="继续告诉导购你的需求" maxlength="300" autocomplete="off" required placeholder="或者，你可以直接打字告诉我"><button class="btn" id="follow-send">发送</button></form></div></div></aside></main><footer class="wrap demo-note">AI 导购 Demo · 商品与数据为模拟</footer><dialog id="entry" aria-labelledby="entry-title"><h2 id="entry-title"></h2><p id="entry-copy" class="muted"></p><form method="dialog"><button class="btn">关闭</button></form></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><header class="drawer-head"><h2 id="drawer-title"></h2><button id="drawer-close" class="btn subtle" type="button">关闭</button></header><div id="drawer-content" class="drawer-content"></div><footer id="drawer-footer" class="drawer-footer" hidden><label><input id="select-all" type="checkbox"> 全选</label><div class="drawer-checkout"><output id="cart-total" aria-live="polite">合计 $0.00</output><button id="purchase" class="btn" type="button">购买商品</button></div></footer></dialog><dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div><div class="detail-actions"><button class="btn" id="add" type="button">加入购物车</button><button class="btn subtle" id="detail-favorite" type="button">♡ 收藏</button><button class="btn subtle" id="close" type="button">关闭</button></div></dialog>

const productDialog=$('detail');
function photoOffset(tile) {
  const target=tile.getBoundingClientRect(), source=productDialog.querySelector('.art').getBoundingClientRect();
  return {x:target.left+target.width/2-source.left-source.width/2,
    y:target.top+target.height/2-source.top-source.height/2,
    scaleX:target.width/source.width,scaleY:target.height/source.height};
}
productDialog.addEventListener('close',()=>{
  wallOrigin=null;
  document.body.classList.remove('wall-preview');
  productDialog.classList.remove('detail-closing');
});
function closeProduct() {
  if(!productDialog.open || productDialog.classList.contains('detail-closing'))return;
  if(!motion){productDialog.close();return;}
  productDialog.classList.add('detail-closing');
  const photo=productDialog.querySelector('.art');
  const finish=()=>{productDialog.close();productDialog.classList.remove('detail-closing');};
  if(wallOrigin&&wallOrigin.isConnected){
    gsap.killTweensOf(photo);
    gsap.set(photo,{clearProps:'transform'});
    gsap.timeline({onComplete:finish})
      .to(photo,{...photoOffset(wallOrigin),duration:.28,ease:'power2.in',clearProps:'transform'},0)
      .to(productDialog,{opacity:0,duration:.16,clearProps:'opacity'},.12);
  } else gsap.to(productDialog,{opacity:0,scale:.975,y:10,duration:.2,ease:'power2.in',overwrite:true,clearProps:'opacity,transform',onComplete:finish});
}
$('close').onclick=closeProduct;
productDialog.addEventListener('cancel',event=>{event.preventDefault();closeProduct();});
let backdropDown=false;
function onBackdrop(event) {
  const r=productDialog.getBoundingClientRect();
  return event.target===productDialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom);
}
productDialog.addEventListener('pointerdown',event=>{backdropDown=onBackdrop(event);});
productDialog.addEventListener('click',event=>{if(backdropDown&&onBackdrop(event))closeProduct();backdropDown=false;});
$('add').onclick=()=>{

  if(matchMedia('(hover:hover)').matches && $('add').matches(':hover') && !$('add').matches(':focus-visible'))$('add').classList.add('just-added');

function renderPages(total) {
  const nav = $('pages');
  const previouslyFocused = nav.contains(document.activeElement);
  $('paging').hidden = total < 2;
  $('page-number').dataset.total=total;
  const count = Math.min(5,total);
  const start = Math.max(1, Math.min(shelfPage - 2, total - count + 1));
  const buttons = [['‹',shelfPage-1,'上一页']];
  if (start > 1) buttons.push(['…']);
  for (let page=start; page<start+count; page++) {
    buttons.push([page,page,'第 '+page+' 页']);
  }
  if (start + count <= total) buttons.push(['…']);
  buttons.push(['›',shelfPage+1,'下一页']);
  nav.innerHTML = buttons.map(([label,page,name])=>label==='…'
    ? '<span aria-hidden="true">…</span>'
    : '<button type="button" aria-label="'+name+'" data-page="'+page+'" '+(typeof label==='number'&&page===shelfPage?'aria-current="page"':'')+' '+(page<1||page>total?'disabled':'')+'>'+label+'</button>').join('');
  if (previouslyFocused && !nav.hidden) nav.querySelector('[aria-current]').focus({preventScroll:true});
}
function jumpTo(page) {
  shelfPage = page;
  renderShelf();
  $('shelf-title').scrollIntoView({block:'start'});
}
$('page-jump').onsubmit=event=>{
  event.preventDefault();
  const field=$('page-number');
  const value=field.value.trim();
  if (!/^[+-]?\d+$/.test(value)) return;
  field.value='';
  jumpTo(Math.max(1,Math.min(Number(field.dataset.total),Number(value))));
};
$('pages').onclick = event=>{
  const button = event.target.closest('button[data-page]');
  if (!button || button.disabled) return;
  jumpTo(Number(button.dataset.page));
};

function drawDrawer() {
  const shopping = drawerKind === '购物车';
  const ids = shopping ? [...cart.keys()] : drawerKind==='收藏' ? [...favorites].reverse() : drawerKind==='足迹' ? [...recent].reverse() : [];
  const emptyCopy = {购物车:'购物车还是空的',收藏:'还没有收藏，看到喜欢的点♡收藏',足迹:'还没有足迹',};
  $('drawer-footer').hidden = !shopping || !ids.length;
  $('drawer-content').innerHTML = ids.length ? '<div class="drawer-grid'+(shopping?' cart-grid':'')+'">'+ids.map(id=>{

    return shopping ? '<article class="drawer-item">'+details+'<label><input type="checkbox" data-cart-check="'+id+'" '+(selected.has(id)?'checked':'')+' aria-label="选择 '+p.name+'">选择</label></article>'
      : '<button class="drawer-item" type="button" data-reopen="'+id+'">'+details+'</button>';
  }).join('')+'</div>' : '<p class="muted">'+emptyCopy[drawerKind]+'</p>';

function updateChecks() {
  const total=catalog.reduce((sum,p)=>sum+(selected.has(p.id)?p.price*(cart.get(p.id)||0):0),0);
  $('cart-total').textContent='合计 $'+total.toFixed(2);
  $('select-all').checked = Boolean(cart.size && selected.size===cart.size);
  $('select-all').indeterminate = selected.size>0 && selected.size<cart.size;
  $('purchase').disabled = selected.size===0;
}
function openDrawer(kind) {
  drawerKind = kind;

let drawerClosing=false;
function closeDrawer(after) {
  if (!drawer.open || drawerClosing) return;
  drawerClosing=true;
  const finish=()=>{drawer.close();delete drawer.dataset.closing;drawerClosing=false;after?.();};
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
  drawer.dataset.closing='';
  const timer=setTimeout(finish,240);
  drawer.addEventListener('animationend',event=>{if(event.target===drawer){clearTimeout(timer);finish();}},{once:true});
}
$('drawer-close').onclick=()=>closeDrawer();
drawer.addEventListener('cancel',event=>{event.preventDefault();closeDrawer();});
let drawerBackdropDown=false;
const isDrawerBackdrop=event=>event.target===drawer&&event.clientX<drawer.getBoundingClientRect().left;

$('drawer-content').addEventListener('change',event=>{

});

function clearImageSearch() {
  if (imageUrl) URL.revokeObjectURL(imageUrl);
  imageUrl='';imageMatches=[];

  $('rankings').hidden=false;
}
$('image-search').onclick=()=>$('image-file').click();

function imageData(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(Error('无法读取图片'));
    reader.readAsDataURL(file);
  });
}
$('image-file').onchange=async event=>{
  const file=event.target.files[0];
  event.target.value='';
  if (!file) return;
  ++turn;
  setBusy(false);
  clearImageSearch();
  imageUrl=URL.createObjectURL(file);
  const requestImage=imageUrl;
  $('query-thumb').src=imageUrl;
  $('image-result').hidden=false;
  $('image-result').dataset.loading='';
  $('vision-title').textContent='正在识图…';
  $('vision-note').textContent='DeepSeek 正在分析包型与风格';
  shelfPage=1;
  switchView('goods');
  renderShelf(false);
  $('image-result').scrollIntoView({block:'nearest'});
  try {
    if (!model) throw Error('请先启动 DeepSeek 服务，再使用以图搜款。');
    if (!/^image\/(?:jpeg|png|gif|webp)$/.test(file.type)||file.size>8*1024*1024) throw Error('请选择 8 MB 以内的 JPG、PNG、GIF 或 WebP 图片。');
    const response=await fetch('/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:await imageData(file)})});
    if (!response.ok) throw Error('识图暂时失败，请稍后重试。');
    const result=await response.json();
    if(imageUrl!==requestImage)return;
    if(!result.type) {
      $('vision-title').textContent='未识别到清晰的包袋';
      $('vision-note').textContent='请换一张主体清楚的包袋照片。';
      return;
    }
    const score=p=>Number((p.type||'双肩包')===result.type)*4+Number(p.style===result.style)*2;
    imageMatches=distinctPicks(catalog.filter(p=>p.stock&&score(p)>0).sort((a,b)=>score(b)-score(a)||recommendOrder(a,b)),3);
    $('vision-title').textContent=imageMatches.length?'找到 '+imageMatches.length+' 款相似商品':'货盘里暂无相似款';
    $('vision-note').textContent='DeepSeek 识别：'+result.type+(result.style?' · '+result.style:'')+'。按包型和风格匹配。';
    renderShelf();
  } catch(error) {
    if(imageUrl!==requestImage)return;
    $('vision-title').textContent='暂未得到识图结果';
    $('vision-note').textContent=error.message;
  } finally {if(imageUrl===requestImage)delete $('image-result').dataset.loading;}
};
